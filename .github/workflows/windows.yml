name: Windows build

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # attach the zip to the GitHub Release on tag pushes
    steps:
      - uses: actions/checkout@v4

      # mediapipe 0.10.21 only ships wheels for Python 3.9-3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Windows/requirements.txt

      - name: Build and smoke test
        shell: pwsh
        run: ./Windows/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TurtleNeck-Windows-x64
          path: Windows/dist/TurtleNeck-Windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "TurtleNeck $env:TAG" --generate-notes
          }
          gh release upload $env:TAG Windows/dist/TurtleNeck-Windows-x64.zip --clobber
